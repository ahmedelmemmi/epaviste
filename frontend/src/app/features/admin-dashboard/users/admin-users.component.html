<div>
  <h4 class="mb-4">👥 User Management</h4>

  <div *ngIf="successMessage" class="alert alert-success alert-dismissible">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <!-- Filters -->
  <div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Search by name or email…"
                 [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
        </div>
        <div class="col-md-3">
          <select class="form-select" [(ngModel)]="selectedRole" (change)="onSearch()">
            <option value="">All Roles</option>
            <option value="BUYER">Buyer</option>
            <option value="SELLER">Seller</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-danger w-100" (click)="onSearch()">🔍 Search</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-danger"></div>
  </div>

  <div *ngIf="!loading" class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Joined</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge"
                    [class.bg-primary]="user.role === 'BUYER'"
                    [class.bg-success]="user.role === 'SELLER'"
                    [class.bg-danger]="user.role === 'ADMIN'">
                {{ user.role }}
              </span>
            </td>
            <td>
              <span class="badge"
                    [class.bg-success]="user.status === 'ACTIVE'"
                    [class.bg-warning]="user.status === 'SUSPENDED'"
                    [class.bg-secondary]="user.status === 'DEACTIVATED'">
                {{ user.status }}
              </span>
            </td>
            <td>{{ user.createdAt | date:'mediumDate' }}</td>
            <td>
              <div class="btn-group btn-group-sm">
                <button *ngIf="user.status !== 'SUSPENDED'" class="btn btn-outline-warning"
                        (click)="updateStatus(user, 'SUSPENDED')" title="Suspend">🚫</button>
                <button *ngIf="user.status === 'SUSPENDED'" class="btn btn-outline-success"
                        (click)="updateStatus(user, 'ACTIVE')" title="Activate">✅</button>
                <button class="btn btn-outline-secondary" (click)="resetPassword(user)" title="Reset Password">🔑</button>
                <button *ngIf="user.status !== 'DEACTIVATED'" class="btn btn-outline-danger"
                        (click)="deactivate(user)" title="Deactivate">🗑</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="7" class="text-center text-muted py-4">No users found.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center" *ngIf="totalPages > 1">
      <button class="btn btn-sm btn-outline-secondary" (click)="prevPage()" [disabled]="currentPage === 0">← Prev</button>
      <span class="text-muted small">Page {{ currentPage + 1 }} of {{ totalPages }}</span>
      <button class="btn btn-sm btn-outline-secondary" (click)="nextPage()" [disabled]="currentPage >= totalPages - 1">Next →</button>
    </div>
  </div>
</div>
