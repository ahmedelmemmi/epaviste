<div *ngIf="loading" class="text-center py-2">
  <div class="spinner-border spinner-border-sm text-primary"></div>
</div>

<div *ngIf="!loading && !error && profile" class="card border-0 bg-light rounded-3 p-3 mb-3">
  <div class="d-flex align-items-start gap-3">
    <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
         style="width:48px;height:48px;min-width:48px;">
      <span class="fs-4">🏪</span>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="fw-bold">{{ profile.name }}</span>
        <span *ngIf="profile.verified" class="badge bg-success d-flex align-items-center gap-1" style="font-size:0.7rem;">
          ✓ Verified
        </span>
      </div>
      <div *ngIf="profile.companyName" class="text-muted small mb-1">{{ profile.companyName }}</div>
      <div class="d-flex align-items-center gap-2 mb-1">
        <span class="d-flex align-items-center">
          <span *ngFor="let star of getStars()">
            <span *ngIf="isFullStar(star, profile.rating || 0)" style="color:#f5a623;font-size:1rem;">★</span>
            <span *ngIf="isHalfStar(star, profile.rating || 0)" style="color:#f5a623;font-size:1rem;">⯪</span>
            <span *ngIf="!isFullStar(star, profile.rating || 0) && !isHalfStar(star, profile.rating || 0)" style="color:#ccc;font-size:1rem;">★</span>
          </span>
        </span>
        <span class="fw-semibold small">{{ (profile.rating || 0) | number:'1.1-1' }}</span>
        <span class="text-muted small">({{ profile.reviewCount }} review{{ profile.reviewCount !== 1 ? 's' : '' }})</span>
      </div>
      <div *ngIf="profile.deliveryZones" class="text-muted small">
        📍 {{ profile.deliveryZones }}
      </div>
    </div>
  </div>
</div>
