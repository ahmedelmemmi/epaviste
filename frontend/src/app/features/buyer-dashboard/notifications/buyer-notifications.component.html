<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">
    Notifications
    <span *ngIf="unreadCount > 0" class="badge bg-danger ms-2">{{ unreadCount }}</span>
  </h4>
  <button *ngIf="unreadCount > 0" class="btn btn-sm btn-outline-secondary" (click)="markAllAsRead()">
    Mark all as read
  </button>
</div>

<div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary"></div>
</div>

<div *ngIf="!loading && notifications.length === 0" class="text-center py-5 text-muted">
  <div class="fs-1 mb-2">🔔</div>
  <p>No notifications yet.</p>
</div>

<div *ngIf="!loading && notifications.length > 0" class="card border-0 shadow-sm">
  <ul class="list-group list-group-flush">
    <li
      *ngFor="let n of notifications"
      class="list-group-item d-flex justify-content-between align-items-start"
      [class.bg-light]="!n.read">
      <div class="flex-grow-1">
        <span class="badge bg-secondary me-2">{{ n.type }}</span>
        {{ n.message }}
        <small class="d-block text-muted mt-1">{{ n.createdAt | date:'medium' }}</small>
      </div>
      <button *ngIf="!n.read" class="btn btn-sm btn-link text-secondary ms-2 p-0" (click)="markAsRead(n.id)">
        ✓ Read
      </button>
    </li>
  </ul>
</div>
