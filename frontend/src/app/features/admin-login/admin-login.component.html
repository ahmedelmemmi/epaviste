<div class="min-vh-100 d-flex align-items-center justify-content-center bg-dark">
  <div class="col-md-4 col-lg-3">
    <div class="card border-0 shadow-lg">
      <div class="card-header bg-danger text-white text-center py-4">
        <div class="mb-2">
          <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
        <h4 class="fw-bold mb-1">Admin Access</h4>
        <small class="opacity-75">Restricted area — authorized personnel only</small>
      </div>
      <div class="card-body p-4">

        <div class="alert alert-danger" *ngIf="errorMessage">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" formControlName="email" placeholder="admin@example.com"
              [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" formControlName="password"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <div class="invalid-feedback">Password is required.</div>
          </div>

          <button type="submit" class="btn btn-danger w-100" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ loading ? 'Signing in...' : 'Sign In as Admin' }}
          </button>
        </form>
      </div>
      <div class="card-footer text-center text-muted py-3">
        <small><a routerLink="/auth/login" class="text-muted">← Back to regular login</a></small>
      </div>
    </div>
  </div>
</div>
