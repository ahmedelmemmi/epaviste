    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item" *ngIf="currentUser?.role === 'BUYER'">
          <a class="nav-link" routerLink="/buyer/dashboard" routerLinkActive="active">My RFQs</a>
        </li>
        <li class="nav-item" *ngIf="currentUser?.role === 'BUYER'">
          <a class="nav-link" routerLink="/buyer/rfq/new" routerLinkActive="active">New RFQ</a>

        <li class="nav-item" *ngIf="currentUser?.role === 'SELLER'">
          <a class="nav-link" routerLink="/seller-dashboard" routerLinkActive="active">Seller Dashboard</a>

        <li class="nav-item" *ngIf="currentUser?.role === 'SELLER'">
          <a class="nav-link" routerLink="/seller/rfqs" routerLinkActive="active">Browse RFQs</a>
        </li>
        <li class="nav-item" *ngIf="currentUser?.role === 'SELLER'">
          <a class="nav-link" routerLink="/seller/dashboard" routerLinkActive="active">My Quotes</a>
        </li>
        <li class="nav-item" *ngIf="currentUser">
          <a class="nav-link" routerLink="/orders/tracking" routerLinkActive="active">Orders</a>
