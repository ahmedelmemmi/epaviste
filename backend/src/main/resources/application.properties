spring.application.name=epaviste
server.port=8080

# Database - override via env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/epaviste}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:epaviste}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:epaviste123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - override via env var: APP_JWT_SECRET (must be at least 32 characters)
app.jwt.secret=${APP_JWT_SECRET:epaviste-secret-key-for-jwt-token-generation-must-be-long-enough}
app.jwt.expiration=86400000

# CORS - override via env var: APP_CORS_ALLOWED_ORIGINS (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Commission
app.commission.rate=0.10
