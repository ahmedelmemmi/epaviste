# DEPRECATED — This project has migrated from Koyeb to Render (free tier).
# The backend is now deployed via render.yaml alongside the frontend.
# This file is kept for historical reference only and is no longer used.
#
# Original Koyeb service definition for the epaviste backend (Spring Boot / Docker)
# Free tier: nano instance — 0.1 vCPU, 512 MB RAM

name: epaviste-backend
services:
  - name: api
    type: web
    git:
      repository: github.com/ahmedelmemmi/epaviste
      branch: main
    build:
      type: dockerfile
      dockerfile: backend/Dockerfile
      context: backend
    instance_type: free
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
        port: 8080
    health_checks:
      - port: 8080
        protocol: tcp
        initial_delay_seconds: 60
        period_seconds: 30
    env:
      # --- Database (from Neon.tech) ---
      # Paste the JDBC connection string from Neon dashboard
      # Format: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        value: "REPLACE_WITH_NEON_JDBC_URL"
      - key: SPRING_DATASOURCE_USERNAME
        value: "REPLACE_WITH_NEON_USERNAME"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "REPLACE_WITH_NEON_PASSWORD"

      # --- JWT (generate a strong random string, min 32 chars) ---
      - key: APP_JWT_SECRET
        value: "REPLACE_WITH_STRONG_SECRET_MIN_32_CHARS"
      - key: APP_JWT_EXPIRATION
        value: "86400000"

      # --- CORS: must match your Render frontend URL ---
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://epaviste-frontend.onrender.com"

      # --- App ---
      - key: APP_COMMISSION_RATE
        value: "0.10"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
