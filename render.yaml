services:
  # Backend Spring Boot API
  - type: web
    name: epaviste-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: epaviste-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: epaviste-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: epaviste-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://epaviste-frontend.onrender.com"
      - key: APP_COMMISSION_RATE
        value: "0.10"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
        # Note: For production, consider switching to 'validate' once schema is stable
        # and using a migration tool like Flyway for controlled schema changes

  # Frontend Angular Static Site
  - type: web
    name: epaviste-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Note: update the destination URL below to match your backend service name on Render
      # The backend service name in this file is 'epaviste-backend', which maps to epaviste-backend.onrender.com
      - type: rewrite
        source: /api/*
        destination: https://epaviste-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: epaviste-db
    plan: starter
    databaseName: epaviste
    user: epaviste
