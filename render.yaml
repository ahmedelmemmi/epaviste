services:
  # Frontend Angular Static Site — free on Render
  # Backend is deployed separately on Koyeb (free tier) — see DEPLOYMENT.md
  - type: web
    name: epaviste-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # After deploying the backend on Koyeb, replace KOYEB_APP_URL with your actual
      # Koyeb service URL (e.g. epaviste-backend-<org>.koyeb.app) — see DEPLOYMENT.md
      - type: rewrite
        source: /api/*
        destination: https://KOYEB_APP_URL/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
