services:
  # Backend Spring Boot — free Docker web service on Render
  # Note: free tier spins down after 15 min of inactivity; first request may take ~30–50 s.
  - type: web
    name: epaviste-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # --- Database (from Neon.tech) ---
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # --- JWT ---
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_JWT_EXPIRATION
        value: "86400000"

      # --- CORS: must match your Render frontend URL ---
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://epaviste-frontend.onrender.com"

      # --- App ---
      - key: APP_COMMISSION_RATE
        value: "0.10"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  # Frontend Angular Static Site — free on Render
  - type: web
    name: epaviste-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://epaviste-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
